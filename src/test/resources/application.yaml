# 테스트 전용 설정 (메모리 H2, 테스트용 키라서 커밋해도 된다)
spring:
  datasource:
    url: jdbc:h2:mem:galae-test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LXRlc3Qtb25seS1rZXktdGVzdC1vbmx5LWtleS10ZXN0LW9ubHk=
  access-token:
    expr-time: 3600
  refresh-token:
    expr-time: 1209600

cors:
  allowed-origins: http://localhost:*

galae:
  zone: Asia/Seoul
  today: 2026-09-25
  feed:
    include-unchecked: true
  seed:
    enabled: true
  admin:
    handle: admin
    password: admin1234

# 테스트에서는 AiClient를 목으로 바꾸므로 실제로 호출하지 않는다
bizrouter:
  base-url: http://localhost:1/v1
  api-key:
  model: test/model
  timeout-seconds: 5
